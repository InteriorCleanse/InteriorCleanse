<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="KeyRaptor icon">
  <defs>
    <linearGradient id="kr-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6bffbb"/>
      <stop offset="0.55" stop-color="#15e37a"/>
      <stop offset="1" stop-color="#06a957"/>
    </linearGradient>
    <filter id="kr-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- clipped-corner badge, matches the cyber UI card -->
  <path d="M20 6 H108 L122 20 V108 L108 122 H20 L6 108 V20 Z"
        fill="#04100b" stroke="rgba(21,227,122,0.35)" stroke-width="2"/>

  <g filter="url(#kr-glow)">
    <!-- key bow = raptor head, tapering into a blade; teeth carved on the right -->
    <path d="M64 24 L86 37 L86 58 L74 70 L72 112 L64 120 L56 108 L54 70 L42 58 L42 37 Z"
          fill="url(#kr-neon)"/>

    <!-- beak strike pointing out of the head -->
    <path d="M86 46 L104 41 L91 54 Z" fill="url(#kr-neon)"/>

    <!-- carve two key teeth on the right edge (badge-coloured notches) -->
    <rect x="63" y="80" width="15" height="7" fill="#04100b"/>
    <rect x="63" y="94" width="11" height="7" fill="#04100b"/>

    <!-- raptor eye -->
    <circle cx="63" cy="46" r="8" fill="#04100b"/>
    <circle cx="65" cy="45" r="3.4" fill="#6bffbb"/>
  </g>
</svg>
