<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="GCode Keys icon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6bffbb"/><stop offset=".55" stop-color="#15e37a"/><stop offset="1" stop-color="#06a957"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- clipped-corner badge, matches the cyber UI -->
  <path d="M20 6 H108 L122 20 V108 L108 122 H20 L6 108 V20 Z" fill="#04100b" stroke="rgba(21,227,122,0.35)" stroke-width="2"/>

  <g filter="url(#glow)">
    <!-- G built as a key bow: thick ring, opened on the right, with the G's spur -->
    <circle cx="54" cy="52" r="26" fill="none" stroke="url(#g)" stroke-width="11"/>
    <!-- open the ring on the right (badge-coloured notch) => reads as G/C -->
    <rect x="54" y="45" width="40" height="14" fill="#04100b"/>
    <!-- the G's inward spur -->
    <rect x="58" y="46" width="20" height="11" rx="1" fill="url(#g)"/>

    <!-- key blade dropping from the bow, with two teeth carved on the right -->
    <rect x="48" y="74" width="12" height="40" rx="2" fill="url(#g)"/>
    <rect x="59" y="86" width="13" height="7" fill="#04100b"/>
    <rect x="59" y="99" width="9" height="7" fill="#04100b"/>

    <!-- terminal cursor block: the "code" cue -->
    <rect x="92" y="30" width="12" height="17" rx="1" fill="#6bffbb"/>
  </g>
</svg>
