<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-label="KeyRaptor">
  <defs>
    <linearGradient id="kr-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5bffb0"/>
      <stop offset="0.5" stop-color="#15e37a"/>
      <stop offset="1" stop-color="#07b45e"/>
    </linearGradient>
    <filter id="kr-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- icon -->
  <g transform="translate(8,11)">
    <path d="M20 6 H108 L122 20 V108 L108 122 H20 L6 108 V20 Z"
          fill="#04100b" stroke="rgba(21,227,122,0.35)" stroke-width="2"/>
    <g filter="url(#kr-glow)">
      <path d="M64 24 L86 37 L86 58 L74 70 L72 112 L64 120 L56 108 L54 70 L42 58 L42 37 Z"
            fill="url(#kr-neon)"/>
      <path d="M86 46 L104 41 L91 54 Z" fill="url(#kr-neon)"/>
      <rect x="63" y="80" width="15" height="7" fill="#04100b"/>
      <rect x="63" y="94" width="11" height="7" fill="#04100b"/>
      <circle cx="63" cy="46" r="8" fill="#04100b"/>
      <circle cx="65" cy="45" r="3.4" fill="#6bffbb"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <text x="150" y="88" font-size="52" letter-spacing="1" fill="#eafff4">KEY<tspan fill="url(#kr-neon)" filter="url(#kr-glow)">RAPTOR</tspan></text>
    <text x="152" y="116" font-size="14.5" letter-spacing="7" fill="rgba(21,227,122,0.8)" font-weight="600">CUT · CODED · ANYWHERE</text>
  </g>
</svg>
