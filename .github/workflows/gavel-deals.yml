name: Gavel deal finder

# Give it a budget; it reads the live auction sources now and lists the cars
# that fit: clean title, no damage (or minor), priced against similar cars,
# all-in cost inside the budget, room under the ceiling. Real lots only.
# Run it from the Actions tab (Run workflow) and read the "Find deals" step.
# GSA runs with the shared DEMO_KEY; eBay, MarketCheck and auto.dev join when
# their keys are repository secrets (same names as .env).

on:
  workflow_dispatch:
    inputs:
      budget:
        description: 'Your budget for one car, all in (dollars)'
        required: true
        default: '15000'
      damage:
        description: 'Most damage allowed: none or minor'
        required: true
        default: 'minor'
      min_year:
        description: 'Oldest model year wanted (blank = any year)'
        required: false
        default: ''
      min_profit:
        description: 'Leave out cars with an estimated profit under this (dollars, blank = any)'
        required: false
        default: ''
      makes:
        description: 'Makes to search, comma separated (blank = 20 popular makes)'
        required: false
        default: ''

  # Also when the finder changes, so a change is seen on real lots: the owner's
  # starting budget ($3,000 to $5,000), any year and 2014 or newer.
  push:
    paths: ['auction-scanner/src/finder.ts', 'auction-scanner/src/find.ts', '.github/workflows/gavel-deals.yml']

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.budget && format('[{{"budget":"{0}","min_year":"{1}"}}]', inputs.budget, inputs.min_year) || '[{"budget":"3000","min_year":""},{"budget":"5000","min_year":""},{"budget":"5000","min_year":"2014"}]') }}
    defaults:
      run:
        working-directory: auction-scanner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Find deals
        # Inputs go through the environment, never into the command line.
        run: node src/find.ts
        env:
          BUDGET: ${{ matrix.budget }}
          DAMAGE: ${{ inputs.damage || 'minor' }}
          MIN_YEAR: ${{ matrix.min_year }}
          MIN_PROFIT: ${{ inputs.min_profit }}
          MAKES: ${{ inputs.makes }}
          GAVEL_GSA: '1'
          GAVEL_GSA_API_KEY: ${{ secrets.GAVEL_GSA_API_KEY }}
          GAVEL_EBAY_CLIENT_ID: ${{ secrets.GAVEL_EBAY_CLIENT_ID }}
          GAVEL_EBAY_CLIENT_SECRET: ${{ secrets.GAVEL_EBAY_CLIENT_SECRET }}
          GAVEL_MARKETCHECK_API_KEY: ${{ secrets.GAVEL_MARKETCHECK_API_KEY }}
          GAVEL_MARKETCHECK_AUCTION_PATH: ${{ secrets.GAVEL_MARKETCHECK_AUCTION_PATH }}
          GAVEL_AUTODEV_API_KEY: ${{ secrets.GAVEL_AUTODEV_API_KEY }}
