name: CI

# The GitHub Pages deploy workflow was removed: the site now has API routes,
# middleware, and a Stripe webhook, none of which can exist in a static export.
# Hosting moved to Vercel, which deploys on push by itself. This workflow just
# catches a broken build before Vercel ships it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Build-time placeholders. Real values live in Vercel; every
          # integration is read lazily at request time, so the build does not
          # need working credentials.
          NEXT_PUBLIC_SITE_URL: https://interiorcleanse.com

  secret-scan:
    # The repository is public, so a committed key is a leaked key. Gitleaks runs
    # over the full history; allowlisted paths and fingerprints are in
    # .gitleaks.toml and .gitleaksignore. The binary is pinned and checksummed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan for secrets
        run: ./gitleaks git . --config .gitleaks.toml --no-banner --redact
