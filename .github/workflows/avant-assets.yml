name: 'AVANT: land assets'

# Downloads the AI-generated imagery listed in avant/content/asset-sources.json,
# compresses it to web JPEGs, and commits it with the landed manifest so the
# app serves local copies instead of the generation CDN. Run from the Actions
# tab after generating or replacing an image.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: avant
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm i --no-save --no-fund sharp
      - run: npm run assets:pull
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img content/assets-landed.json
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "AVANT: land generated imagery"
          git push
