name: AVANT

# Gates for the AVANT app in avant/. Runs only when it changes.
# Order: secrets scan, dependency audit, types, lint, unit tests (app and
# vault), production build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        working-directory: .
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-fund

      - name: Dependency audit (fail on high or critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Unit tests (pricing, eligibility, crypto, signatures, verification)
        run: npm test

      - name: Vault tests
        working-directory: services/vault
        run: npm test

      - name: Build
        run: npm run build
