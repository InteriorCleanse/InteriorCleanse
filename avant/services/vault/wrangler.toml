# AVANT privacy vault. Deploys unchanged to either:
#   Cloudflare Workers:   npx wrangler deploy
#   open-compute (self-hosted, one binary, your hardware):
#                         ocd wrangler deploy
# open-compute supports Workers, D1 and Cron, which is all this service uses.
name = "avant-vault"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "avant-vault"
database_id = "REPLACE_WITH_D1_ID"   # `wrangler d1 create avant-vault` prints it; open-compute assigns one locally.

[triggers]
crons = ["17 3 * * *"]   # daily purge of expired records and old audit rows

[vars]
RECORD_TTL_DAYS = "365"
AUDIT_TTL_DAYS = "400"

# Secret (never in this file):
#   wrangler secret put SIGNING_KEY      (same value as AVANT_VAULT_SIGNING_KEY in the app)
