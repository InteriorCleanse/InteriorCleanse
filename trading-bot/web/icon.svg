<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mr. Cash">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
  <!-- three rising candle bodies: the record, read left to right -->
  <rect x="118" y="292" width="58" height="96" rx="14" fill="url(#mint)" opacity=".55"/>
  <rect x="204" y="236" width="58" height="152" rx="14" fill="url(#mint)" opacity=".78"/>
  <rect x="290" y="164" width="58" height="224" rx="14" fill="url(#mint)"/>
  <!-- the wick lines -->
  <rect x="143" y="262" width="8" height="30" rx="4" fill="#34d399" opacity=".55"/>
  <rect x="229" y="204" width="8" height="32" rx="4" fill="#34d399" opacity=".78"/>
  <rect x="315" y="128" width="8" height="36" rx="4" fill="#34d399"/>
  <!-- the read: a line through the closes, ending in a point, not an arrow (no forecast) -->
  <path d="M147 300 L233 236 L319 160 L394 120" fill="none" stroke="#e6edf3" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  <circle cx="394" cy="120" r="18" fill="#e6edf3"/>
</svg>
