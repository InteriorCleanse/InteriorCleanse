<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gavel</title>
<meta name="description" content="Gavel — an AI car-auction scanner. Clean cars, dumb cheap, explained. Paper bidding by default." />
<meta name="theme-color" content="#E6DBC2" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#14120E" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Gavel" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body class="on-paper">
<div class="grain" aria-hidden="true"></div>
<header class="topbar">
  <a class="brand" href="#home" aria-label="Gavel, go home"><span class="eyelet" aria-hidden="true"></span><span class="wordmark">Gavel</span></a>
  <span class="spacer"></span>
  <button class="chip" id="mode-chip" type="button" title="Where the cars on the feed come from">…</button>
  <button class="ring" id="account-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">·</button>
  <div class="menu" id="account-menu" role="menu" hidden></div>
</header>

<nav class="tabs" aria-label="Screens">
  <a href="#home" class="rail-brand" aria-label="Gavel, go home"><span class="eyelet" aria-hidden="true"></span>Gavel</a>
  <a href="#home" data-tab="home">Home</a>
  <a href="#feed" data-tab="feed">Feed</a>
  <a href="#sniper" data-tab="sniper">Sniper <span class="n" id="sniper-badge" hidden></span></a>
  <a href="#garage" data-tab="garage">Garage</a>
  <a href="#import" data-tab="import" class="desk-only">Import</a>
  <a href="#watch" data-tab="watch" class="desk-only">Watch</a>
  <a href="#intel" data-tab="intel" class="desk-only">Intel</a>
  <a href="#auctions" data-tab="auctions" class="desk-only">Auctions</a>
  <a href="#playbook" data-tab="playbook" class="desk-only">Playbook</a>
  <a href="#rental" data-tab="rental" class="desk-only">Rental</a>
  <a href="#admin" data-tab="admin" class="desk-only owner-only" hidden>Members</a>
  <a href="#connect" data-tab="connect" class="desk-only owner-only" hidden>Connect</a>
  <a href="#settings" data-tab="settings" class="desk-only">Settings</a>
  <button type="button" id="more-btn" data-tab="more" class="phone-only">More</button>
</nav>

<main id="main">
  <section class="screen" id="screen-home" data-screen="home" hidden></section>
  <section class="screen" id="screen-setup" data-screen="setup" hidden></section>
  <section class="screen" id="screen-garage" data-screen="garage" hidden></section>
  <section class="screen" id="screen-import" data-screen="import" hidden></section>
  <section class="screen" id="screen-connect" data-screen="connect" hidden></section>
  <section class="screen" id="screen-feed" data-screen="feed" hidden></section>
  <section class="screen" id="screen-plan" data-screen="plan" hidden></section>
  <section class="screen" id="screen-watch" data-screen="watch" hidden></section>
  <section class="screen" id="screen-auctions" data-screen="auctions" hidden></section>
  <section class="screen" id="screen-playbook" data-screen="playbook" hidden></section>
  <section class="screen" id="screen-rental" data-screen="rental" hidden></section>
  <section class="screen" id="screen-settings" data-screen="settings" hidden></section>
  <section class="screen" id="screen-admin" data-screen="admin" hidden></section>
  <section class="screen" id="screen-sniper" data-screen="sniper" hidden></section>
  <section class="screen" id="screen-intel" data-screen="intel" hidden></section>
</main>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="sheet-root"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
