<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in — Gavel</title>
<meta name="theme-color" content="#EEEFF1" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B0D0F" media="(prefers-color-scheme: dark)" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Gavel" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body class="on-paper door">
<main class="login">
  <div class="tag">
    <svg class="logo-mark big" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><defs><mask id="gm-l"><rect width="64" height="64" fill="#fff"/><g transform="rotate(-14 33 32)"><rect x="23" y="24.6" width="11.5" height="2" fill="#000"/><rect x="23" y="37.4" width="11.5" height="2" fill="#000"/></g></mask></defs><path d="M41.42 12.68 A21.5 21.5 0 1 0 53.29 34.99" fill="none" stroke="currentColor" stroke-width="7"/><path class="s1" d="M52.86 26.80 A21.5 21.5 0 0 0 51.64 23.26" fill="none" stroke-width="7"/><path class="s2" d="M51.16 22.24 A21.5 21.5 0 0 0 48.94 18.76" fill="none" stroke-width="7"/><path class="s3" d="M48.23 17.89 A21.5 21.5 0 0 0 45.24 15.06" fill="none" stroke-width="7"/><g mask="url(#gm-l)"><g transform="rotate(-14 33 32)"><rect x="33" y="29" width="14.5" height="6" rx="1" fill="currentColor"/><rect x="23.5" y="21" width="10.5" height="22" rx="2.5" fill="currentColor"/></g></g></svg>
    <span class="wordmark">Gavel</span>
    <p class="tagline">Clean cars, dumb cheap, explained.</p>
    <div class="seg" role="tablist" aria-label="Who is signing in">
      <button type="button" role="tab" id="tab-member" aria-selected="true" aria-controls="form-member">Member</button>
      <button type="button" role="tab" id="tab-owner" aria-selected="false" aria-controls="form-owner">Owner</button>
    </div>
    <form id="form-member" role="tabpanel" aria-labelledby="tab-member" novalidate>
      <label class="f">Email <input type="email" name="email" autocomplete="email" required inputmode="email" /></label>
      <label class="f" style="margin-top:10px">Access code <input type="text" name="code" autocomplete="one-time-code" required placeholder="GVL-XXXX-XXXX-XXXX" spellcheck="false" /><small>Your code came with your subscription. Lost it? Ask the owner for a new one.</small></label>
      <button class="btn" type="submit" style="margin-top:14px;width:100%">Sign in</button>
    </form>
    <form id="form-owner" role="tabpanel" aria-labelledby="tab-owner" hidden novalidate>
      <label class="f">Owner PIN <input type="password" name="pin" inputmode="numeric" autocomplete="current-password" required /><small>Only for the person who runs this Gavel. Members sign in on the Member tab with their email and access code.</small></label>
      <button class="btn" type="submit" style="margin-top:14px;width:100%">Sign in as owner</button>
    </form>
    <p class="err" id="err" role="alert"></p>
    <p class="dim mono" style="margin:12px 0 0;text-align:center">Paper bidding by default · Nothing here spends money</p>
  </div>
</main>
<script type="module" src="/js/login.js"></script>
</body>
</html>
