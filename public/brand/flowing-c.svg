<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Interior Cleanse">
  <!--
    The flowing ribbon C from the master logo, redrawn as clean vector.

    Deliberately NOT a trace of the raster: the master's C is built from four
    overlapping graphite ribbons with soft shading, and an autotrace of that
    produces a few hundred nodes that collapse into a blob below ~48px. This is
    the same gesture — a wide ribbon that tapers into two curled tips — drawn as
    two filled paths that stay legible at 16px.

    `currentColor` so one file serves both the light and dark variants.
  -->
  <g fill="currentColor" fill-rule="evenodd">
    <!-- Upper ribbon: sweeps from the top curl down and around the left. -->
    <path d="M47.8 13.4c-1.1 3.2-3.9 4.8-7.5 5.6-5.3 1.2-9.9 3.1-13 7.2-2.6 3.4-3.3 7.4-2.4 11.5.2 1 .6 2 1 3-3.6-2.4-5.8-5.9-6.2-10.3-.5-5.6 2-10.4 6.5-14 3.9-3.1 8.5-4.7 13.4-5.3 2.2-.3 4.4-.3 6.6.1.6.1 1.1.3 1.6.6l-.3.9c0 .2 0 .5.3.7z"/>
    <!-- Lower ribbon: mirrors it, closing the C and ending in the second curl. -->
    <path d="M24.6 40.3c1.9 3.6 5 5.7 8.9 6.6 4.6 1.1 9 .5 13.2-1.6.9-.5 1.8-1.1 2.7-1.7.3 1.6-.2 3-1.1 4.2-1.9 2.6-4.6 4.1-7.6 5-5.4 1.7-10.7 1.4-15.8-1.1-5.1-2.5-8.4-6.6-9.7-12.2-1.4-6.2.2-11.7 4.1-16.6.3-.4.7-.8 1.1-1.1-2 4.1-2.6 8.3-1.6 12.7.5 2.1 1.4 4 2.7 5.7l3.1.1z"/>
    <!-- The two curl tips, drawn separately so they keep their weight when small. -->
    <path d="M45.9 9.6c2.4-1.3 4.8-1.6 7.2-.4 1.4.7 2.3 1.9 2.7 3.4-1.9-1.4-3.9-1.9-6.2-1.5-1.4.2-2.6.8-3.7 1.7l-.9-1.4.9-1.8z"/>
    <path d="M49.3 44.1c2.1-1.6 3.4-3.6 3.6-6.2 1.7 1.6 2.3 3.5 1.8 5.7-.5 2.3-1.9 3.9-4 4.9-.5.2-1 .4-1.6.5l-.6-2.3.8-2.6z"/>
  </g>
</svg>
